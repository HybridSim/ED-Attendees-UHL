<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIDCARE© Operational | UHL ED Attendees | Beta</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

  <style>
    :root { --gap: 10px; --plot-h: 260px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:#111; background:#fff; }
    header { padding: 10px 12px; border-bottom: 1px solid #eee; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:8px; }
    .brand img { height:32px; width:auto; }
    .brand h1 { margin:0; font-size:16px; letter-spacing:.2px; font-weight:600; }
    .toolbar { display:flex; gap:6px; align-items:center; font-size:12px; }
    .btn { padding:4px 8px; border:1px solid #ddd; background:#fff; border-radius:10px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.05); font-weight:600; font-size:12px; }
    .btn:disabled { opacity:.55; cursor:default; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 10px; }
    .controls { display:grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: var(--gap); margin: 8px 0 10px; }
    @media (max-width: 1100px){ .controls{grid-template-columns: repeat(3, minmax(200px, 1fr));} }
    @media (max-width: 860px){ .controls{grid-template-columns: repeat(2, minmax(200px, 1fr));} }
    @media (max-width: 560px){ .controls{grid-template-columns: 1fr;} }
    .control { background:#fafafa; border:1px solid #eee; border-radius:10px; padding:8px; box-shadow:0 1px 2px rgba(0,0,0,.04) }
    .control label { display:block; font-weight:600; font-size:11px; margin-bottom:4px; }
    .control input[type=range] { width:100%; height:18px; }
    .val { font-variant-numeric: tabular-nums; font-size:11px; color:#444; margin-top:2px; }
    .toggle { display:flex; align-items:center; gap:6px; font-size:11px; color:#444; margin-top:4px; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
    @media (max-width: 980px){ .grid { grid-template-columns:1fr; } }
    #edPlot, #trolleyPlot{height:var(--plot-h)}
  </style>
</head>

<body>
<header>
  <div class="brand">
    <img src="https://assets.zyrosite.com/AoP61N2BR4i8Q6jl/logo-hsml-AE07eKDgMLFgWBoQ.png">
    <h1>MIDCARE© Operational — UHL ED Attendees</h1>
  </div>
  <div class="toolbar">
    <button id="run" class="btn">▶ Run</button>
    <button id="pause" class="btn" disabled>⏸ Pause</button>
    <button id="reset" class="btn">⟲ Reset</button>
    <span id="yearLabel" style="font-weight:600;">Year: 2025 (observed)</span>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="control">
      <label>CAGR ED attendees</label>
      <input id="growth" type="range" min="0" max="0.15" step="0.0005" value="0.05045">
      <div class="val"><span id="growthVal"></span> / yr</div>
    </div>

    <div class="control">
      <label>Critical mass / cap K</label>
      <input id="capK" type="range" min="0" max="150000" step="1000" value="60000">
      <div class="val"><span id="capKVal"></span> people</div>
      <div class="toggle">
        <input id="showAllK" type="checkbox" checked>
        <label>Show all multiples of K</label>
      </div>
    </div>

    <div class="control">
      <label>End year</label>
      <input id="endYear" type="range" min="2026" max="2075" step="1" value="2075">
      <div class="val"><span id="endYearVal"></span></div>
    </div>
  </div>

  <div class="grid">
    <div id="edPlot"></div>
  </div>
</div>

<script>
(function(){

/* ---------- DATA ---------- */

const YEARS_HIST = [2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];
const HIST = [55502,57297,64443,67818,69567,71315,65824,76473,79892,80113,87366,95373];

/* ---------- HELPERS ---------- */

const $ = id => document.getElementById(id);
const pct = v => (v*100).toFixed(2)+"%";
const fmt = v => (+v).toLocaleString();

function fullEDSeries(hx,hy,px,py){
  return { years:hx.concat(px), values:hy.concat(py) };
}

function findKYears(values,K,years,show){
  if(!show || K<=0) return [];
  let hits=[], m=1, target=K;
  for(let i=0;i<values.length;i++){
    if(values[i] >= target){
      hits.push(years[i]);
      target = K * (++m);
    }
  }
  return hits;
}

/* ---------- MODEL ---------- */

function makeYears(end){
  const a=[];
  for(let y=2026;y<=end;y++) a.push(y);
  return a;
}

function simulateED(r, years){
  const out=[];
  let v = HIST[HIST.length-1]; // anchor at observed 2025
  for(let i=0;i<years.length;i++){
    v *= (1+r);
    out.push(v);
  }
  return out;
}

/* ---------- UI ---------- */

const growth=$("growth"), capK=$("capK"), endYear=$("endYear"), showAllK=$("showAllK");
const growthVal=$("growthVal"), capKVal=$("capKVal"), endYearVal=$("endYearVal");
const yearLabel=$("yearLabel");

function updateLabels(){
  growthVal.textContent = pct(+growth.value);
  capKVal.textContent = fmt(+capK.value);
  endYearVal.textContent = endYear.value;
}

/* ---------- RENDER ---------- */

function render(){
  updateLabels();

  const YEARS_PROJ = makeYears(+endYear.value);
  const ED_PROJ = simulateED(+growth.value, YEARS_PROJ);

  const full = fullEDSeries(YEARS_HIST, HIST, YEARS_PROJ, ED_PROJ);
  const kYears = findKYears(full.values, +capK.value, full.years, showAllK.checked);

  Plotly.react("edPlot",[
    {x:YEARS_HIST, y:HIST, mode:"lines", name:"Historic UHL total", line:{color:"#d62728",width:2}},
    {x:YEARS_PROJ, y:ED_PROJ, mode:"lines", name:"ED (projection)", line:{color:"#1f77b4",width:3}}
  ],{
    shapes: kYears.map(y=>({
      type:"line",
      x0:y,x1:y,y0:0,y1:1.2e6,
      line:{dash:"dash",color:"rgba(139,0,0,0.85)",width:2}
    })),
    xaxis:{title:"Year",range:[2014,+endYear.value]},
    yaxis:{title:"People"},
    legend:{orientation:"h",y:-0.25}
  },{responsive:true});

  yearLabel.textContent = "Observed to 2025 • Projection from 2026";
}

/* ---------- EVENTS ---------- */

[growth,capK,endYear,showAllK].forEach(el=>{
  el.addEventListener("input",render);
});

/* ---------- INIT ---------- */

render();

})();
</script>
</body>
</html>
