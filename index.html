<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIDCARE© Operational | UHL ED Attendees | Beta</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

  <style>
    :root { --gap: 10px; --plot-h: 260px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:#111; background:#fff; }
    header { padding: 10px 12px; border-bottom: 1px solid #eee; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:8px; }
    .brand img { height:32px; width:auto; }
    .brand h1 { margin:0; font-size:16px; letter-spacing:.2px; font-weight:600; }
    .toolbar { display:flex; gap:6px; align-items:center; font-size:12px; }
    .btn { padding:4px 8px; border:1px solid #ddd; background:#fff; border-radius:10px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.05); font-weight:600; font-size:12px; }
    .btn:disabled { opacity:.55; cursor:default; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 10px; }
    .controls { display:grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: var(--gap); margin: 8px 0 10px; }
    @media (max-width: 1100px){ .controls{grid-template-columns: repeat(3, minmax(200px, 1fr));} }
    @media (max-width: 860px){ .controls{grid-template-columns: repeat(2, minmax(200px, 1fr));} }
    @media (max-width: 560px){ .controls{grid-template-columns: 1fr;} }
    .control { background:#fafafa; border:1px solid #eee; border-radius:10px; padding:8px; box-shadow:0 1px 2px rgba(0,0,0,.04) }
    .control label { display:block; font-weight:600; font-size:11px; margin-bottom:4px; }
    .control input[type=range], .control select { width:100%; }
    .control input[type=range] { height: 18px; }
    .val { font-variant-numeric: tabular-nums; font-size:11px; color:#444; margin-top:2px; }
    .toggle { display:flex; align-items:center; gap:6px; font-size:11px; color:#444; margin-top:4px; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: var(--gap); align-items:stretch; }
    @media (max-width: 980px){ .grid { grid-template-columns:1fr; } }
    #edPlot, #trolleyPlot{height:var(--plot-h)}
  </style>
</head>

<body>
<header>
  <div class="brand">
    <img src="https://assets.zyrosite.com/AoP61N2BR4i8Q6jl/logo-hsml-AE07eKDgMLFgWBoQ.png" alt="MIDCARE / HSML Logo">
    <h1>MIDCARE© Operational — UHL ED Attendees</h1>
  </div>
  <div class="toolbar">
    <button id="run" class="btn">▶ Run</button>
    <button id="pause" class="btn" disabled>⏸ Pause</button>
    <button id="reset" class="btn">⟲ Reset</button>
    <span id="yearLabel" style="margin-left:6px;font-weight:600;">Year: 2025 (observed)</span>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="control">
      <label for="growth">Compound Annual Growth Rate (CAGR) ED attendees </label>
      <input id="growth" type="range" min="0.00" max="0.15" step="0.0005" value="0.05045">
      <div class="val"><span id="growthVal">5.05%</span> / yr</div>
    </div>
    <div class="control">
      <label for="initial">Initial attendees (2014)</label>
      <input id="initial" type="range" min="30000" max="100000" step="100" value="55502">
      <div class="val"><span id="initialVal">55,502</span> people</div>
    </div>
    <div class="control">
      <label for="conv">ED admission (conversion) rate</label>
      <input id="conv" type="range" min="0" max="1" step="0.001" value="0.333">
      <div class="val"><span id="convVal">33.3%</span></div>
    </div>
    <div class="control">
      <label for="present">Average presentations per day</label>
      <input id="present" type="range" min="0" max="500" step="1" value="152">
      <div class="val"><span id="presentVal">152</span> per day</div>
    </div>
    <div class="control">
      <label for="los">Average length of stay (days) — always applied</label>
      <input id="los" type="range" min="0" max="60" step="0.1" value="5">
      <div class="val"><span id="losVal">5.0</span> days</div>
    </div>
    <div class="control">
      <label for="capK">Critical mass / cap K</label>
      <input id="capK" type="range" min="0" max="150000" step="1000" value="60000">
      <div class="val"><span id="capKVal">60,000</span> people</div>
      <div class="toggle">
        <input id="showAllK" type="checkbox" autocomplete="off" checked>
        <label for="showAllK">Show all multiples of K</label>
      </div>
    </div>
    <div class="control">
      <label for="capGrowth">Annual trolley capacity growth</label>
      <input id="capGrowth" type="range" min="0.00" max="0.15" step="0.0005" value="0.05045">
      <div class="val"><span id="capGrowthVal">5.05%</span> / yr</div>
    </div>
    <div class="control">
      <label for="endYear">Projection end year</label>
      <input id="endYear" type="range" min="2026" max="2075" step="1" value="2075">
      <div class="val"><span id="endYearVal">2075</span></div>
    </div>
  </div>

  <div class="grid">
    <div id="edPlot"></div>
    <div id="trolleyPlot"></div>
  </div>
</div>

<script>
(function(){
  // Observed historic series 1014 to 2025
  const YEARS_HIST = [2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];
  const HIST_UHL_MW_TOTAL = [55502,57297,64443,67818,69567,71315,65824,76473,79892,80113,87366,95373];
})();
</script>

</body>
</html>
