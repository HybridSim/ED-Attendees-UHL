<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIDCARE© Operational | UHL ED Attendees | Beta</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

  <style>
    :root { --gap: 10px; --plot-h: 260px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:#111; background:#fff; }
    header { padding: 10px 12px; border-bottom: 1px solid #eee; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:8px; }
    .brand img { height:32px; width:auto; }
    .brand h1 { margin:0; font-size:16px; font-weight:600; }
    .toolbar { display:flex; gap:6px; align-items:center; font-size:12px; }
    .btn { padding:4px 8px; border:1px solid #ddd; background:#fff; border-radius:10px; cursor:pointer; font-weight:600; }
    .btn:disabled { opacity:.55; cursor:default; }
    .wrap { max-width:1200px; margin:0 auto; padding:10px; }
    .controls { display:grid; grid-template-columns:repeat(4,minmax(200px,1fr)); gap:10px; }
    @media (max-width:980px){ .controls{grid-template-columns:1fr 1fr;} }
    @media (max-width:560px){ .controls{grid-template-columns:1fr;} }
    .control { background:#fafafa; border:1px solid #eee; border-radius:10px; padding:8px; }
    .control label { font-size:11px; font-weight:600; }
    .val { font-size:11px; color:#444; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:980px){ .grid{grid-template-columns:1fr;} }
    #edPlot,#trolleyPlot{height:260px}
  </style>
</head>

<body>
<header>
  <div class="brand">
    <img src="https://assets.zyrosite.com/AoP61N2BR4i8Q6jl/logo-hsml-AE07eKDgMLFgWBoQ.png" alt="MIDCARE / HSML Logo">
    <h1>MIDCARE© Operational — UHL ED Attendees</h1>
  </div>
  <div class="toolbar">
    <button id="run" class="btn">▶ Run</button>
    <button id="pause" class="btn" disabled>⏸ Pause</button>
    <button id="reset" class="btn">⟲ Reset</button>
    <span id="yearLabel"><strong>Year: 2025 (observed)</strong></span>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="control">
      <label>CAGR ED attendances</label>
      <input id="growth" type="range" min="0" max="0.15" step="0.0005" value="0.05045">
      <div class="val"><span id="growthVal"></span> / yr</div>
    </div>
    <div class="control">
      <label>Initial attendees (2014)</label>
      <input id="initial" type="range" min="30000" max="100000" step="100" value="55502">
      <div class="val"><span id="initialVal"></span></div>
    </div>
    <div class="control">
      <label>ED admission rate</label>
      <input id="conv" type="range" min="0" max="1" step="0.001" value="0.333">
      <div class="val"><span id="convVal"></span></div>
    </div>
    <div class="control">
      <label>Average presentations/day (2014)</label>
      <input id="present" type="range" min="0" max="500" step="1" value="152">
      <div class="val"><span id="presentVal"></span></div>
    </div>
    <div class="control">
      <label>Length of stay (days)</label>
      <input id="los" type="range" min="0" max="60" step="0.1" value="5">
      <div class="val"><span id="losVal"></span></div>
    </div>
    <div class="control">
      <label>Critical mass K</label>
      <input id="capK" type="range" min="0" max="150000" step="1000" value="60000">
      <div class="val"><span id="capKVal"></span></div>
      <label><input id="showAllK" type="checkbox" checked> Show multiples</label>
    </div>
    <div class="control">
      <label>Capacity growth</label>
      <input id="capGrowth" type="range" min="0" max="0.15" step="0.0005" value="0.05045">
      <div class="val"><span id="capGrowthVal"></span> / yr</div>
    </div>
    <div class="control">
      <label>End year</label>
      <input id="endYear" type="range" min="2026" max="2075" step="1" value="2075">
      <div class="val"><span id="endYearVal"></span></div>
    </div>
  </div>

  <div class="grid">
    <div id="edPlot"></div>
    <div id="trolleyPlot"></div>
  </div>
</div>

<script>
(function(){

/* ---------- DATA ---------- */

const YEARS_HIST = [2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];
const HIST = [55502,57297,64443,67818,69567,71315,65824,76473,79892,80113,87366,95373];

/* ---------- HELPERS ---------- */

const pct = v => (v*100).toFixed(2)+"%";
const fmt = v => v.toLocaleString();
const $ = id => document.getElementById(id);

function fullEDSeries(hx,hy,px,py){
  return { years:hx.concat(px), values:hy.concat(py) };
}

function findKYears(values,K,years,show){
  if(!show||K<=0) return [];
  let hits=[], m=1, tgt=K;
  for(let i=0;i<values.length;i++){
    if(values[i]>=tgt){
      hits.push(years[i]);
      tgt=K*(++m);
    }
  }
  return hits;
}

/* ---------- MODEL ---------- */

function makeYears(end){
  const a=[2025];
  for(let y=2026;y<=end;y++) a.push(y);
  return a;
}

function simulateED(r,years){
  const out=[HIST[HIST.length-1]];
  for(let i=1;i<years.length;i++) out.push(out[i-1]*(1+r));
  return out;
}

/* ---------- UI ---------- */

function show(){
  growthVal.textContent=pct(+growth.value);
  initialVal.textContent=fmt(+initial.value);
  convVal.textContent=pct(+conv.value);
  presentVal.textContent=present.value;
  losVal.textContent=(+los.value).toFixed(1);
  capKVal.textContent=fmt(+capK.value);
  capGrowthVal.textContent=pct(+capGrowth.value);
  endYearVal.textContent=endYear.value;
}

/* ---------- INIT ---------- */

const growth=$("growth"), initial=$("initial"), conv=$("conv"), present=$("present"),
      los=$("los"), capK=$("capK"), capGrowth=$("capGrowth"), endYear=$("endYear"),
      showAllK=$("showAllK");

const growthVal=$("growthVal"), initialVal=$("initialVal"), convVal=$("convVal"),
      presentVal=$("presentVal"), losVal=$("losVal"), capKVal=$("capKVal"),
      capGrowthVal=$("capGrowthVal"), endYearVal=$("endYearVal");

show();

/* ---------- COMPUTE ---------- */

let years=makeYears(+endYear.value);
let ED=simulateED(+growth.value,years);
let full=fullEDSeries(YEARS_HIST,HIST,years,ED);
let kYears=findKYears(full.values,+capK.value,full.years,showAllK.checked);

/* ---------- PLOTS ---------- */

Plotly.newPlot("edPlot",[
  {x:YEARS_HIST,y:HIST,mode:"lines",name:"Historic",line:{color:"#d62728"}},
  {x:years,y:ED,mode:"lines",name:"Projection",line:{color:"#1f77b4"}}
],{
  shapes:kYears.map(y=>({type:"line",x0:y,x1:y,y0:0,y1:1e6,line:{dash:"dash",color:"darkred"}})),
  xaxis:{title:"Year"},yaxis:{title:"People"}
},{responsive:true});

})();
</script>
</body>
</html>
